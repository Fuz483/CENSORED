services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smartspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    user: "10001:10001"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smartspace}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      UO_DEMO_ENABLED: "false"
      CORS_ORIGINS: "[]"
    volumes:
      - room_photo_data:/app/uploads/room-photos
    networks: [edge, database]
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers
        --forwarded-allow-ips ${WEB_PROXY_IP:-172.29.241.2}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"]
      interval: 15s
      timeout: 4s
      start_period: 30s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      edge:
        ipv4_address: ${WEB_PROXY_IP:-172.29.241.2}
    depends_on:
      backend:
        condition: service_healthy

networks:
  edge:
    ipam:
      config:
        - subnet: ${WEB_PROXY_SUBNET:-172.29.241.0/24}
  database:
    internal: true

volumes:
  postgres_data:
  room_photo_data:
