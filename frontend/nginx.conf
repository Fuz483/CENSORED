# The host HTTPS proxy sets these headers and reaches this service over loopback.
map $http_x_real_ip $trusted_client_ip {
    "" $remote_addr;
    default $http_x_real_ip;
}

map $http_x_forwarded_proto $trusted_scheme {
    https https;
    default $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    client_max_body_size 9m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $trusted_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location ~ ^/(api|media)(/|$)|^/(health|ready)$ {
        proxy_pass $api_upstream;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
